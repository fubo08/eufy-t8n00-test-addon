name: eufy T8N00 RTC Test Bridge
version: "0.3.7"
slug: eufy_t8n00_test
stage: experimental
description: Experimental T8N00 WebRTC command bridge. Run only one bridge per eufy account.
url: "https://github.com/fubo08/eufy-t8n00-test-addon"
arch:
  - aarch64
  - amd64
init: false
hassio_api: true
discovery:
  - eufy_sdk
ingress: true
ingress_port: 3000
panel_icon: mdi:cctv
ports:
  3000/tcp: 3000
  8554/tcp: 8554
ports_description:
  3000/tcp: Bridge WS + HTTP control (point the eufy-sdk integration here)
  8554/tcp: RTSP
options:
  email: ""
  password: ""
  country: DE
  poll_ms: 600000
  stream_idle_ms: 300000
  rtsp_idle_off_ms: 300000
  prewarm: false
  event_log: true
  debug: false
  debug_p2p: false
  go2rtc_enable: true
  rtc_video_ice_policy: relay
  solix_email: ""
  solix_password: ""
  solix_country: ""
  solix_scene_poll_ms: 90000
  solix_retry_base_ms: 900000
  solix_retry_max_ms: 3600000
schema:
  email: str
  password: password
  country: str
  poll_ms: int(0,)
  stream_idle_ms: int(0,)
  rtsp_idle_off_ms: int(0,)
  stream_battery_budget_ms: "int(1,)?"
  prewarm: bool
  event_log: bool
  debug: bool
  debug_p2p: bool
  go2rtc_enable: bool
  rtc_video_ice_policy: list(relay|all)
  solix_email: "str?"
  solix_password: "password?"
  solix_country: "str?"
  solix_scene_poll_ms: "int(5000,)?"
  solix_retry_base_ms: "int(10000,)?"
  solix_retry_max_ms: "int(10000,)?"
