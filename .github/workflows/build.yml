name: Validate test bridge
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  container:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux/amd64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: eufy_t8n00_test
          platforms: ${{ matrix.platform }}
          load: true
          tags: eufy-t8n00-test:ci
      - name: Bridge regression tests against patched SDK
        run: docker run --rm --entrypoint sh eufy-t8n00-test:ci -c 'node --test test/*.test.mjs'
